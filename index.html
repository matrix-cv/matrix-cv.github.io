<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Computer Vision (PL)</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent-color: #38bdf8;
            --text-main: #f8fafc; --text-muted: #94a3b8; --nav-bg: rgba(15, 23, 42, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding-top: 70px; }
        nav { position: fixed; top: 0; left: 0; width: 100%; background-color: var(--nav-bg); backdrop-filter: blur(8px); border-bottom: 1px solid #334155; z-index: 1000; padding: 1rem 2rem; }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: 1.2rem; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--accent-color); }
        .nav-links { display: flex; list-style: none; gap: 1.5rem; align-items: center; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--accent-color); }
        .lang-switch { background: #334155; color: #fff; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        header, section { max-width: 1100px; margin: 0 auto; padding: 5rem 2rem; border-bottom: 1px solid #1e293b; }
        header { text-align: center; padding-top: 7rem; }
        header h1 { font-size: 2.8rem; margin-bottom: 0.5rem; }
        header h1 span { color: var(--accent-color); }
        header p { color: var(--text-muted); font-size: 1.2rem; max-width: 600px; margin: 0 auto 2rem auto; }
        section h2 { font-size: 2rem; margin-bottom: 2rem; border-left: 4px solid var(--accent-color); padding-left: 0.75rem; }
        .offer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .offer-card { background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        .offer-card i { font-size: 2.5rem; color: var(--accent-color); display: block; margin-bottom: 1rem; }
        .offer-card h3 { margin-bottom: 0.5rem; }
        .offer-card p { color: var(--text-muted); font-size: 0.95rem; }
        
        /* POPRAWKA: Nowa struktura siatki dla obrazów z efektem hover */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
        .project-card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #334155; transition: transform 0.3s ease; }
        .project-card:hover { transform: translateY(-5px); }
        
        /* Kontener obrazu z efektem zoomu */
        .image-container { width: 100%; height: 200px; overflow: hidden; position: relative; background-color: #0b111e; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .project-card:hover .image-container img { transform: scale(1.05); }
        
        .project-info { padding: 1.5rem; }
        .project-info h3 { margin-bottom: 0.5rem; }
        .project-info p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem; }
        .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tags span { background-color: #0f172a; color: var(--accent-color); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
        .contact-container { background-color: var(--card-bg); padding: 3rem; border-radius: 12px; border: 1px solid #334155; text-align: center; max-width: 600px; margin: 0 auto; }
        .contact-btn { display: inline-flex; align-items: center; gap: 0.5rem; background-color: var(--accent-color); color: #0f172a; padding: 0.75rem 2rem; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 1.5rem; transition: opacity 0.2s; cursor: pointer; border: none; font-size: 1rem; }
        .contact-btn:hover { opacity: 0.9; }
        .back-to-top { display: block; text-align: right; margin-top: 2rem; }
        .back-to-top a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .back-to-top a:hover { color: var(--accent-color); }
        footer { text-align: center; padding: 3rem 2rem; color: var(--text-muted); font-size: 0.9rem; background-color: #0b111e; border-top: 1px solid #1e293b; }
        @media (max-width: 768px) { nav { padding: 1rem; } .nav-links { gap: 0.8rem; } .nav-links a { font-size: 0.85rem; } header h1 { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#" class="logo">Matrix<span>CV</span></a>
            <ul class="nav-links">
                <li><a href="#realizacje">Realizacje</a></li>
                <li><a href="#oferta">Oferta</a></li>
                <li><a href="#kontakt">Kontakt</a></li>
                <li><a href="en.html" class="lang-switch">EN</a></li>
            </ul>
        </div>
    </nav>

    <header id="home">
        <h1>Inżynier <span>obrazu cyfrowego</span></h1>
        <p>Projektuję i wdrażam dopasowane systemy wizyjne.</p>
        <p>Emisja strony <span>18/09/2026</span></p>
    </header>

    <footer>
        <p>&copy; 2026 Łukasz Pater | Specjalista analizy i przetwarzania obrazu</p>
    </footer>
    
</body>
</html>
